name = "picket-downloads"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The website is served by Cloudflare Pages on the same hostname. A worker route
# wins over Pages for the paths it matches, so only the release objects are
# handled here and everything else stays with Pages.
[[routes]]
pattern = "picket-code.noware.cn/picket-code-*"
zone_name = "noware.cn"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "picket-releases"
