name: Gitee Sync

# 触发：GitHub Release 发布后自动分卷并同步到 Gitee Release；
# 也可手动运行（workflow_dispatch）补齐历史版本。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 GitHub Release tag（如 v1.143.1-p1）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Split and upload to Gitee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download GitHub release assets
        uses: robinraju/release-downloader@v1
        with:
          repository: dantesun/picket-code
          tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fileName: "picket-code-*"
          out-file-path: dist

      - name: Split assets >100MB into Gitee-compatible segments
        run: bash build/split-for-gitee.sh dist 95M

      - name: Upload segments to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}   # Gitee 私人令牌（需 releases 权限）
          GITEE_REPO: ${{ vars.GITEE_REPO }}        # 如 dantesun/picket-code
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "== sync tag $TAG -> $GITEE_REPO"
          # 1) 查找 Gitee release（tag 需已存在于 Gitee 仓库；请开启 Gitee 仓库定时同步）
          REL=$(curl -fsS "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null || true)
          if [ -z "$REL" ]; then
            echo ">> release not found on Gitee, creating..."
            REL=$(curl -fsS -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${TAG}" \
              -d "name=${TAG}" \
              -d "body=Picket Code 发行版（GitHub Release 自动同步，含分卷段，见 MERGE.txt）" \
              -d "prerelease=false")
          fi
          ID=$(printf '%s' "$REL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo ">> Gitee release id=$ID"
          # 2) 逐个上传附件（分卷段 / MERGE.txt / SHA256SUMS），已存在则跳过
          for f in dist/*; do
            echo ">> upload: $(basename "$f")"
            curl -fsS -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${f}" \
              || echo "   (skip or already exists: $(basename "$f"))"
          done
          echo "== gitee sync done"

      - name: Upload SHA256SUMS and MERGE.txt
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ID=$(curl -fsS "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          for f in dist/SHA256SUMS dist/MERGE.txt; do
            [ -f "$f" ] || continue
            curl -fsS -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" \
              || echo "skip: $(basename "$f")"
          done
