name: One-off mirror cleanup

# Temporary: retires the legacy download worker and fixes the metadata of the
# already-published SHA256SUMS object (rclone uploaded it as
# application/octet-stream, so browsers download it instead of showing it).
# Delete this file once the run has been checked.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: delete worker + fix object metadata
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rclone version

      - name: Show object metadata before
        run: rclone lsl r2:picket-releases/

      - name: Re-upload SHA256SUMS with a text content type
        run: |
          set -euo pipefail
          key=picket-code-v1.143.1-p4-SHA256SUMS
          curl -fsSL "https://download.noware.cn/$key" -o sums.txt
          rclone copyto --s3-no-check-bucket --ignore-times \
            --header-upload "Content-Type: text/plain; charset=utf-8" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            sums.txt "r2:picket-releases/$key"

      - name: Check the new headers
        run: |
          for i in 1 2 3; do
            curl -sI --max-time 20 "https://download.noware.cn/picket-code-v1.143.1-p4-SHA256SUMS" \
              | grep -iE '^content-type|^cache-control' && break
            sleep 5
          done

      - name: Delete the legacy worker
        run: |
          set -euo pipefail
          code=$(curl -sS -o out.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/picket-downloads")
          echo "delete status: $code"
          head -c 400 out.json; echo
          test "$code" = "200"

      - name: Confirm the legacy URL is gone
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://picket-code.noware.cn/picket-code-v1.143.1-p4-SHA256SUMS")
          echo "legacy host returns: $code"
          test "$code" = "404"
