name: asar probe (manual)

# 一次性诊断用：验证「Node 内部 package.json 读取能否看见 node_modules.asar」，
# 并验证「只把 package.json / 原生模块解包出去」是否足以修复。
# 只读 GitHub Release 里已发布的产物，不修改产品代码。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要探测的 release tag
        default: v1.143.1
        required: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download and unpack the published win32 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" `
            --pattern "picket-code-win32-x64.zip" --dir . --clobber
          Expand-Archive picket-code-win32-x64.zip -DestinationPath pkg -Force
          $appDir = (Get-ChildItem pkg -Recurse -Directory -Filter app |
            Where-Object { $_.FullName -match 'resources\\app$' } | Select-Object -First 1).FullName
          $root = Split-Path (Split-Path $appDir -Parent) -Parent
          "PKG_ROOT=$root" | Add-Content $env:GITHUB_ENV
          "APP_DIR=$appDir" | Add-Content $env:GITHUB_ENV
          "root: $root"
          "asar size: {0:N0} bytes" -f (Get-Item (Join-Path $appDir 'node_modules.asar')).Length
          "resources/app entries: " + ((Get-ChildItem $appDir -Force | Select-Object -ExpandProperty Name) -join ', ')

      - name: Write probe script and helpers
        shell: pwsh
        run: |
          $js = @'
          'use strict';
          const path = require('path');
          const Module = require('module');

          const app = process.cwd();
          const nm = path.join(app, 'node_modules');

          console.log('probe: electron=' + process.versions.electron + ' node=' + process.versions.node);

          const orig = Module._resolveLookupPaths;
          Module._resolveLookupPaths = function (request, parent) {
            const paths = orig(request, parent);
            if (Array.isArray(paths)) {
              for (let i = 0; i < paths.length; i++) {
                if (paths[i] === nm) { paths.splice(i, 0, nm + '.asar'); break; }
              }
            }
            return paths;
          };

          function probe(label, fn) {
            try {
              const r = fn();
              console.log(`${label}: OK ${String(r).replace(app, '<app>')}`);
            } catch (e) {
              console.log(`${label}: FAIL code=${e.code} msg=${String(e.message).split('\n')[0]}`);
            }
          }

          probe('cjs-resolve-tar', () => require.resolve('tar', { paths: [app] }));
          probe('cjs-resolve-zod', () => require.resolve('zod', { paths: [app] }));

          const asarRequire = Module.createRequire(path.join(nm + '.asar', 'x.js'));
          probe('esm-asar-resolve-tar', () => asarRequire.resolve('./tar'));
          probe('esm-asar-resolve-tar-pkgjson', () => asarRequire.resolve('./tar/package.json'));
          probe('esm-asar-resolve-zod', () => asarRequire.resolve('./zod'));

          probe('cjs-load-packed-source', () => {
            const p = require.resolve('katex', { paths: [app] });
            const fs = require('fs');
            return p + ' bytes=' + fs.readFileSync(p).length;
          });

          // D) 关键对比：JS 的 fs（Electron 的 asar 包装层）能不能读归档内文件？
          const fs = require('fs');
          probe('fs-read-asar-json', () => {
            const t = fs.readFileSync(nm + '.asar/katex/package.json', 'utf8');
            return 'bytes=' + t.length + ' name=' + JSON.parse(t).name;
          });
          probe('fs-stat-asar-pkgdir', () => {
            const s = fs.statSync(nm + '.asar/katex');
            return 'isDir=' + s.isDirectory();
          });
          // E) 模块解析器内部的 _findPath（走原生 ReadPackageJSON）
          probe('findpath-asar', () => Module._findPath('katex', [nm + '.asar']));

          // F) 三种路径写法：\\?\ 前缀 / 普通绝对 / 相对
          const peek = (p) => {
            const t = fs.readFileSync(p, 'utf8');
            return JSON.stringify(t.slice(0, 40));
          };
          const plain = (nm + '.asar/katex/package.json').replace(/^\\\\\?\\/, '');
          probe('fs-read-namespaced', () => peek('\\\\?\\' + plain.replace(/\//g, '\\')));
          probe('fs-read-plain-abs', () => peek(plain));
          probe('fs-read-relative', () => { process.chdir(app); return peek('node_modules.asar/katex/package.json'); });
          '@
          # probe.cjs —— app 目录的 package.json 是 "type": "module"，用 .js 会被当 ESM
          Set-Content -Path "$env:GITHUB_WORKSPACE\probe.cjs" -Encoding utf8 -Value $js

          $helper = @'
          param([string]$OutName)
          $exe = (Get-ChildItem "$env:PKG_ROOT\*.exe" | Where-Object { $_.Name -notmatch 'ffmpeg|elevate|crashpad' } | Select-Object -First 1).FullName
          "exe: $exe"
          Copy-Item "$env:GITHUB_WORKSPACE\probe.cjs" "$env:APP_DIR\probe.cjs" -Force
          $out = "$env:GITHUB_WORKSPACE\$OutName.out"
          $err = "$env:GITHUB_WORKSPACE\$OutName.err"
          $env:ELECTRON_RUN_AS_NODE = '1'
          $p = Start-Process -FilePath $exe -ArgumentList 'probe.cjs' -WorkingDirectory $env:APP_DIR `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          "exit code: $($p.ExitCode)"
          "--- stdout ---"
          Get-Content $out -ErrorAction SilentlyContinue
          "--- stderr ---"
          Get-Content $err -ErrorAction SilentlyContinue
          Remove-Item "$env:APP_DIR\probe.cjs" -Force -ErrorAction SilentlyContinue
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\run-probe.ps1" -Encoding utf8 -Value $helper

          $appHelper = @'
          param([string]$Label, [string]$OutName)
          $exe = (Get-ChildItem "$env:PKG_ROOT\*.exe" | Where-Object { $_.Name -notmatch 'ffmpeg|elevate|crashpad' } | Select-Object -First 1).FullName
          $logs = "$env:APPDATA\Picket Code\logs"
          Remove-Item $logs -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--verbose' -PassThru
          Start-Sleep -Seconds 55
          $hits = @()
          if (Test-Path $logs) {
            $hits = Get-ChildItem $logs -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              Select-String -Pattern 'ERR_INVALID_PACKAGE_CONFIG|Invalid package config|Uncaught Exception|Could not locate the bindings file|Cannot find module'
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($hits) { $hits | ForEach-Object { "HIT: " + $_.Line.Trim() } } else { "no packaging errors in app logs" }
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\run-app.ps1" -Encoding utf8 -Value $appHelper

      - name: "Probe 1: baseline (shipped asar)"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\run-probe.ps1" -OutName probe1 | Tee-Object -Variable out
          "### Probe 1 — shipped build (resolution probe)" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: "Probe 2: real app launch on the shipped build"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\run-app.ps1" | Tee-Object -Variable out
          "### Probe 2 — real app, shipped build" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: "Repack: package.json + native binaries outside, code inside"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          npm install -g @electron/asar --silent
          $app = $env:APP_DIR
          $work = Join-Path $env:GITHUB_WORKSPACE "repack"
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          asar extract "$app\node_modules.asar" $work
          Copy-Item "$app\node_modules.asar.unpacked\*" $work -Recurse -Force
          Remove-Item "$app\node_modules.asar" -Force
          Remove-Item "$app\node_modules.asar.unpacked" -Recurse -Force
          # 注意：重复的 --unpack 会被后一个覆盖，必须用花括号一次表达
          asar pack $work "$app\node_modules.asar" `
            --unpack "**/{package.json,*.node,*.wasm}" `
            --unpack-dir "**/{@vscode/vsce-sign,@vscode/ripgrep-universal}"
          "new asar: {0:N0} bytes; files kept outside: {1}" -f (Get-Item "$app\node_modules.asar").Length,
            (Get-ChildItem "$app\node_modules.asar.unpacked" -Recurse -File | Measure-Object).Count
          "outside sample: " + ((Get-ChildItem "$app\node_modules.asar.unpacked" -Recurse -File |
            ForEach-Object { $_.FullName.Replace("$app\node_modules.asar.unpacked\", '') } |
            Sort-Object | Select-Object -First 3) -join ', ')

      - name: "Probe 3: resolution probe against the repacked asar"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\run-probe.ps1" -OutName probe3 | Tee-Object -Variable out
          "### Probe 3 — repacked, resolution probe" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: "Probe 4: real app launch on the repacked build"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\run-app.ps1" | Tee-Object -Variable out
          "### Probe 4 — real app, repacked build" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
