name: Deploy download worker

# Serves the R2 release objects on the website hostname. Deployed from CI only:
# no local wrangler run, and the Cloudflare token never leaves Actions.
on:
  workflow_dispatch:
  push:
    paths:
      - "infra/worker/download/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          workingDirectory: infra/worker/download
          command: deploy
